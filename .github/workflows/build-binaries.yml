name: Build Windows binaries

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [x64, x86]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up NuGet
        uses: nuget/setup-nuget@v3
        with:
          nuget-version: '7.3'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: |
          & $env:NUGET restore .\MeGUI.sln -NonInteractive
        shell: pwsh

      - name: Build MeGUI (Release ${{ matrix.platform }})
        run: |
          msbuild .\MeGUI.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:OutputPath=dist\MeGUI_${{ matrix.platform }}\
        shell: pwsh

      - name: Upload Windows ${{ matrix.platform }} binaries
        uses: actions/upload-artifact@v7
        with:
          name: MeGUI-windows-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/MeGUI_${{ matrix.platform }}/
            !dist/MeGUI_${{ matrix.platform }}/**/*.pdb
            !dist/MeGUI_${{ matrix.platform }}/*.xml
          if-no-files-found: error
          retention-days: 60

      # Make a Release when a tag is pushed
      - name: Extract release notes
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $content = Get-Content 'Changelog.txt' -Raw
          $headers = [regex]::Matches($content, '(?m)^Changelog version[^\r\n]*')

          if ($headers.Count -lt 2) {
            throw "Could not find two Changelog version headers."
          }

          $start = $headers[0].Index + $headers[0].Length
          $end = $headers[1].Index

          $notes = $content.Substring($start, $end - $start).Trim()

          if (-not $notes) {
            throw "Release notes are empty."
          }

          Set-Content -Path 'release-notes.md' -Value $notes -Encoding utf8

      - name: Package release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          Set-Location 'dist/MeGUI_${{ matrix.platform }}'
          $files = Get-ChildItem | Where-Object { $_.PSIsContainer -or $_.Extension -notin @('.pdb', '.xml') }
          & "$env:ProgramFiles\7-Zip\7z.exe" a -t7z -mx=9 "$env:GITHUB_WORKSPACE\MeGUI-windows-${{ matrix.platform }}_${{ github.ref_name }}.7z" $files.Name
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed." }

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: MeGUI ${{ github.ref_name }}
          files: MeGUI-windows-${{ matrix.platform }}_${{ github.ref_name }}.7z
          body_path: release-notes.md
